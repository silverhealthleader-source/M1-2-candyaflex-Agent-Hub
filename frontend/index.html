<style>
/* Layout: 고정 좌측 사이드바(영역 메뉴) + 우측 단일 페이지 뷰. 한 번에 한 페이지만 표시, 페이지 안은 카드 그리드로 가로 배치. 하단 이전/다음 페이저. */
:root{

  --font-display:"Noto Serif KR",Georgia,serif;
  --font-body:"Noto Sans KR",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px; --shadow:0 6px 24px rgba(15,30,46,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111A20; --paper:#1B2830; --side:#0F181E; --side-2:#1A2830;
  --ink:#E9EAEA; --ink-2:#B2BBC3; --muted:#768792; --line:#2E3E48; --line-2:#263540;
  --brand:#7F98A8; --brand-2:#97A2A8; --accent:#E4BD57; --accent-2:#EFCB6B; --accent-soft:#2C2A1E;
  --ok:#5CB58A; --ok-soft:#173127; --warn:#E0A94A; --warn-soft:#3A2A14; --plan:#9AA6B3; --plan-soft:#222D39;
  --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111A20; --paper:#1B2830; --side:#0F181E; --side-2:#1A2830;
  --ink:#E9EAEA; --ink-2:#B2BBC3; --muted:#768792; --line:#2E3E48; --line-2:#263540;
  --brand:#7F98A8; --brand-2:#97A2A8; --accent:#E4BD57; --accent-2:#EFCB6B; --accent-soft:#2C2A1E;
  --ok:#5CB58A; --ok-soft:#173127; --warn:#E0A94A; --warn-soft:#3A2A14; --plan:#9AA6B3; --plan-soft:#222D39;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;letter-spacing:-.005em}

/* shell */
.shell{display:grid;grid-template-columns:272px 1fr;min-height:100%}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:11}

.brand{display:flex;align-items:center;gap:.7rem;padding:0 1.2rem .9rem;border-bottom:1px solid rgba(255,255,255,.08);text-decoration:none;color:#F4F7FA}

.sidenav{list-style:none;margin:.8rem 0 0;padding:0 .7rem;display:grid;gap:2px}
.sidenav .grp{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.14em;color:#7F93A8;padding:.9rem .6rem .3rem;text-transform:uppercase}

.sidenav button:hover{background:var(--side-2)}

.side .foot{margin-top:auto;padding:1rem 1.2rem 0;font-size:.76rem;color:#7F93A8;border-top:1px solid rgba(255,255,255,.08)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.page{display:none;flex:1;padding-block:2rem 2.4rem;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}

.inner{max-width:1240px;margin:0 auto}

.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;padding-bottom:1.2rem;border-bottom:2px solid var(--line);margin-bottom:1.6rem}

.btn{--p:var(--brand);--s:var(--accent);--s-deep:var(--accent-2);--depth:4px;--fg:#FFFFFF;

  transition:transform .09s ease,box-shadow .09s ease,filter .12s ease}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(60% 55% at 22% 0%,rgba(255,255,255,.4),rgba(255,255,255,0) 70%)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(0,0,0,.18),0 calc(var(--depth) + 2px) 0 var(--s),0 calc(var(--depth) + 3px) 0 var(--s-deep),0 calc(var(--depth) + 14px) 20px rgba(15,25,35,.28)}
.btn:active{transform:translateY(calc(var(--depth) - 1px));filter:brightness(.92);box-shadow:inset 0 3px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 var(--s),0 2px 0 var(--s-deep),0 3px 6px rgba(15,25,35,.2)}
.btn-primary,.btn-navy{--p:var(--brand)}
.btn-gold{--p:var(--accent);--fg:#1F2E38;--s:var(--brand);--s-deep:var(--side)}
.btn-outline{--fg:#FFF;background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 var(--depth) 0 var(--s),0 calc(var(--depth) + 1px) 0 var(--s-deep)}
.btn-outline::before{display:none}

.btn.soon::before{display:none}
.cat .btn-primary{--p:var(--c,var(--brand))}
/* AI 크리에이터: 윗면 크림 + 옆면 레드 (반전) */

.hero{background:linear-gradient(135deg,#395060 0%,#243C4B 100%);color:#F4F7FA;border-radius:16px;padding:2.4rem 2.4rem 2.2rem;display:grid;grid-template-columns:1.4fr 1fr;gap:2rem;align-items:center;position:relative;overflow:hidden}

.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;position:relative}

.h2{font-size:1.3rem;margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}

.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.8rem;align-items:stretch}

.flow p{margin:0;font-size:.88rem;color:var(--ink-2)} .flow .core p{color:#CBD6E2}
.flow .arr{display:grid;place-items:center;color:var(--accent-2);font-size:1.5rem}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.mapc{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:1rem 1.1rem;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:grid;gap:.35rem;align-content:start;transition:transform .12s,box-shadow .12s}

/* agent cards */

.items{margin:0;padding:0;list-style:none;display:grid;gap:.22rem;border-top:1px dashed var(--line);padding-top:.6rem}
.items li{display:flex;gap:.5rem;font-size:.88rem;line-height:1.55;color:var(--ink)}

.agent .res{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.1rem}

/* tools, lib */
.tool{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:1.05rem 1.15rem;display:grid;gap:.4rem;align-content:start}

}

let lastGrp = null;
nav.innerHTML = PAGES.map(p=>{ const g = p.grp!==lastGrp ? `<li class="grp">${p.grp}</li>` : ""; lastGrp=p.grp;
  return g + `<li><button data-go="${p.id}" ${p.color?`style="--c:${p.color}"`:""}>${p.color?'<span class="dot"></span>':""}${esc(p.label)}${p.n?`<span class="n">${p.n}</span>`:""}</button></li>`; }).join("");

// pages
const pagesEl = document.getElementById("pages");
pagesEl.innerHTML = PAGES.map((p,i)=>{
  const prev = PAGES[i-1], next = PAGES[i+1];
  return `<section class="page" id="pg-${p.id}" data-page="${p.id}">${p.render()}
  <div class="inner"><div class="pager">${prev?`<button data-go="${prev.id}"><small>← 이전</small><b>${esc(prev.label)}</b></button>`:"<span></span>"}${next?`<button class="next" data-go="${next.id}"><small>다음 →</small><b>${esc(next.label)}</b></button>`:""}</div></div></section>`;
}).join("");

const side=document.getElementById("side"), scrim=document.getElementById("scrim"), hamb=document.getElementById("hamb");
function go(id, push=true){
  if(!PAGES.some(p=>p.id===id)) id="home";
  document.querySelectorAll(".page").forEach(s=>s.classList.toggle("active", s.dataset.page===id));
  nav.querySelectorAll("button").forEach(b=>{ if(b.dataset.go===id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  side.classList.remove("open"); scrim.classList.remove("show"); hamb.setAttribute("aria-expanded","false");
  if(push){ try{ history.replaceState(null,"","#"+id); }catch(e){} }
  window.scrollTo({top:0});
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b){ e.preventDefault(); go(b.dataset.go); } });
hamb.addEventListener("click",()=>{ const o=side.classList.toggle("open"); scrim.classList.toggle("show",o); hamb.setAttribute("aria-expanded",o); });
scrim.addEventListener("click",()=>{ side.classList.remove("open"); scrim.classList.remove("show"); hamb.setAttribute("aria-expanded","false"); });
document.addEventListener("click",async e=>{
  const b=e.target.closest(".copy"); if(!b) return; let ok=false;
  try{ await navigator.clipboard.writeText(b.dataset.copy); ok=true; }catch(err){ const el=document.getElementById("mail"); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  const t=document.createElement("div"); t.className="toast"; t.textContent= ok?"이메일 주소를 복사했습니다":"주소를 선택했습니다. 길게 눌러 복사하세요"; document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
});
go(location.hash ? location.hash.slice(1) : "home", false);
</script>

</body></html>
